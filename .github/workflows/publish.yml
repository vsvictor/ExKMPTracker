name: Publish tracker

# Publishes com.exkmptracker:tracker (Android, JVM, iOS) to GitHub Packages.
# iOS klibs (including the SQLCipher static library) can only be built on macOS.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      # The default package list contains the removed `tools` package; AGP downloads the
      # required platform/build-tools itself once the licenses are accepted.
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - uses: gradle/actions/setup-gradle@v4

      - name: Publish to GitHub Packages
        run: ./gradlew :tracker:publishAllPublicationsToGitHubPackagesRepository --stacktrace
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
